[project]
name = "pythonproject17"
version = "0.1.0"
description = ""
authors = [
    {name = "Lilith",email = "bichakhchyanlilith1992@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "black (>=26.1.0,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.git
  )/
)
'''

[tool.isort]
line_length = 119
force_single_line = true

